controller_manager:
  ros__parameters:
    update_rate: 750  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    left_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    left_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    right_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    right_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_revo2_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_revo2_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Payload / static-droop compensation. Claims the *effort* command interface
    # only, so it runs alongside the position controllers without conflict.
    # Its output lands in tau_commands_, which OpenArmHW::write() adds to
    # grav_torques_ and sends as the MIT frame's t_ff term.
    left_arm_pid_controller:
      type: openarm_pid_controller/PidController

    right_arm_pid_controller:
      type: openarm_pid_controller/PidController

left_forward_position_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position

left_forward_velocity_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: velocity
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity

left_joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position

    # to achieve high real-time performance, interpolation is disabled and the controller is expected to receive high-frequency commands --- IGNORE ---
    interpolation_method: "none"
    interpolate_from_desired_state: true

    state_publish_rate: 50.0
    action_monitor_rate: 50.0
    allow_partial_joints_goal: false

    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      decelerate_on_cancel: false
      openarm_left_joint1: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint2: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint3: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint4: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint5: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint6: { trajectory: 0.0, goal: 0.0 }
      openarm_left_joint7: { trajectory: 0.0, goal: 0.0 }

